name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore Guiders.Assist.sln
      - run: dotnet build Guiders.Assist.sln -c Release --no-restore
      - run: dotnet test Guiders.Assist.sln -c Release --no-build

      - name: TomlCheck sample
        run: |
          dotnet run --project src/AIGuiders.DotnetTools.TomlCheck/AIGuiders.DotnetTools.TomlCheck.csproj -- \
            check samples/
